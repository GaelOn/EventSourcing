name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      execution_target:
        description: Validation runner
        required: true
        type: choice
        options:
          - local
          - github
        default: local

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ${{ inputs.execution_target == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","eventsourcing","local-linux"]') }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Remove previous checkout build outputs
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        find src benchmarks samples validation -type d \( -name bin -o -name obj \) -prune -exec rm -rf -- {} +
        rm -rf -- artifacts
    - name: Restore dependencies
      run: dotnet restore EventSourcing.slnx
    - name: Build Release and generate packages
      run: dotnet build EventSourcing.slnx -c Release --no-restore -warnaserror
    - name: Test
      run: dotnet test EventSourcing.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
    - name: Verify generated package consumers
      shell: bash
      run: |
        set -euo pipefail
        consumer_cache="$PWD/artifacts/consumer-packages"
        for consumer in validation/PackageConsumer validation/DependencyInjectionConsumer validation/TransactionConsumer; do
          dotnet restore "$consumer" --configfile "$consumer/NuGet.Config" --packages "$consumer_cache"
          dotnet run --project "$consumer" -c Release --no-restore -p:RestorePackagesPath="$consumer_cache"
        done
        dotnet restore samples/EventSourcing.PackageConsumer --source "$PWD/artifacts/packages" --packages "$consumer_cache"
        dotnet run --project samples/EventSourcing.PackageConsumer -c Release --no-restore -p:RestorePackagesPath="$consumer_cache"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/test-results/*.trx
        if-no-files-found: ignore
        retention-days: 14
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: event-sourcing-packages-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        if-no-files-found: error
        retention-days: 30
