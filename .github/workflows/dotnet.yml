name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore EventSourcing.slnx
    - name: Build Release and generate packages
      run: dotnet build EventSourcing.slnx -c Release --no-restore -warnaserror
    - name: Test
      run: dotnet test EventSourcing.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/test-results/*.trx
        if-no-files-found: ignore
        retention-days: 14
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: event-sourcing-packages-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        if-no-files-found: error
        retention-days: 30
